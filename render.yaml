services:
  - type: web
    name: mideaGame
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: LOG_LEVEL
        value: info
      - key: MAX_ROOMS
        value: "100"
      - key: QUEST_TIMING
        value: normal
      - key: ALLOWED_ORIGINS
        value: https://mideagame.onrender.com/